[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xagent-eval"
version = "0.1.0"
description = "A reproducible evaluation lab for comparing agent frameworks and models."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "xAgent contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
xagent-eval = "xagent_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xagent_eval"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
